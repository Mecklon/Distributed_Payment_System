spring.application.name=product
server.port=9094
file.upload-dir=app/uploads
spring.data.mongodb.uri=${MONGODB_URI}

spring.kafka.producer.bootstrap-servers=kafka-1:9090
spring.kafka.bootstrap-servers=kafka-1:9090
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.mecklon.core.*

reserve-product-command=reserve.product.command
reserved-product-event=reserved.product.event
failed-reserved-product-event=failed.reserved.product.event
release-product-command=release.product.command
released-product-event=released.product.event

spring.kafka.consumer.group-id=product-service-${random.value}-

spring.kafka.producer.acks=all
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.producer.properties.enable.max.in.flight.request.per.connection=5

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB